name: Daily health check
# Once a day: confirms the portal answers and touches the database, so a quiet off-season week does not
# let the free Supabase project pause. Set the repository variable PORTAL_URL (e.g. https://portal.example.org).
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: |
          if [ -z "$PORTAL_URL" ]; then echo "::notice::PORTAL_URL is not set; nothing to check."; exit 0; fi
          # A sleeping free instance can take about a minute to wake.
          curl -fsS --retry 4 --retry-delay 20 --max-time 90 "$PORTAL_URL/api/health?probe=1"
